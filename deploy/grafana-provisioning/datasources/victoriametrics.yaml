apiVersion: 1

datasources:
  # Metriques machine — miroir de la datasource Loki, cote series temporelles.
  # type prometheus : VictoriaMetrics parle PromQL et l'API de requete de
  # Prometheus, il n'y a pas de plugin dedie a installer.
  - name: VictoriaMetrics
    type: prometheus
    # uid stable : requis par toute regle d'alerte provisionnee qui s'y referera.
    uid: victoriametrics
    access: proxy
    url: http://victoriametrics:8428
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      # VictoriaMetrics ne sert pas l'API d'exemplars de Prometheus.
      exemplarTraceIdDestinations: []
