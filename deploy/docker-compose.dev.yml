# VM de test PARTAGÉE : tous les points de contact hôte sont paramétrables pour
# cohabiter avec d'autres stacks — DATA_ROOT (défaut /data), *_DEV_PORT (défauts
# historiques), et poser COMPOSE_PROJECT_NAME dans l'environnement/.env pour ne
# pas collisionner avec un autre projet compose du même répertoire « deploy ».
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_USER et POSTGRES_PASSWORD lus depuis ${DATA_ROOT}/.env (pas de substitution YAML)
    env_file: ${DATA_ROOT:-/data}/.env
    environment:
      # Base fixe — pas un secret, pas besoin d'être dans .env
      POSTGRES_DB: portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_DEV_PORT:-5432}:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: workspace-portal:dev
    restart: unless-stopped
    # PID 1 = tini (bug 813f425f) : moissonne les orphelins re-parentés
    # (masters ControlMaster expirés, ProxyCommand…) — sans init, ils
    # s'accumulaient en zombies jusqu'à saturer pids-limit (panne du 04/08).
    init: true
    env_file: ${DATA_ROOT:-/data}/.env
    environment:
      # Accès HTTP direct (sans TLS) en dev : désactive le flag Secure sur les
      # cookies de session, sans quoi le navigateur ne les renvoie jamais.
      DEV_MODE: "true"
      # Rôles Keycloak du realm Yoops (voir docker-compose.yml) : prime sur
      # env_file pour que le RBAC matche yoops-admin / yoops-user.
      OIDC_ADMIN_ROLE: yoops-admin
      OIDC_USER_ROLE: yoops-user
    volumes:
      # Côté conteneur toujours /data (PORTAL_DATA_ROOT par défaut)
      - ${DATA_ROOT:-/data}:/data
    ports:
      # Accès direct au portail en dev (bypass Caddy) — smoke test + debug
      - "${PORTAL_DEV_PORT:-8080}:8080"
      # Plage de ports du tunnel SSH workspace
      - "40000-40019:40000-40019"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ${DATA_ROOT:-/data}/.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # CADDY_DEV_PORT=80 par défaut. Sur une machine où le port 80 est déjà pris
      # (ex. Caddy de prod), définir CADDY_DEV_PORT=8090 dans /data/.env.
      - "${CADDY_DEV_PORT:-80}:80"
    networks:
      - internal

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    # user root : le volume Docker nommé est créé root:root ; Loki uid 10001
    # ne peut pas créer ses sous-répertoires sans ça.
    user: "0"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      # Port publié sur le host pour recevoir les push des collecteurs distants.
      - "${LOKI_DEV_PORT:-3100}:3100"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # TSDB des metriques machine : miroir de Loki cote metriques (doc globals §7).
  # VictoriaMetrics single-node plutot que Prometheus : meme protocole
  # (remote_write) et meme langage de requete, pour une empreinte RAM/disque
  # nettement plus faible sur un parc de cette taille.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.109.1
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-metrics-data
      # Retention alignee sur l'usage : voir venir une saturation, pas faire de
      # la capacity planning a l'annee.
      - -retentionPeriod=3
      - -httpListenAddr=:8428
    volumes:
      - vm_data:/victoria-metrics-data
    ports:
      # Publie sur le host : les collecteurs Alloy des machines distantes
      # poussent dessus, exactement comme sur Loki:3100.
      - "8428:8428"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8428/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    env_file: ${DATA_ROOT:-/data}/.env
    environment:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: ${POSTGRES_USER}
      GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GF_OAUTH_CLIENT_ID:-agflow-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GF_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GF_OAUTH_AUTH_URL:-}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GF_OAUTH_TOKEN_URL:-}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GF_OAUTH_API_URL:-}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Accès direct en dev (bypass Caddy) — le port hôte 3000 est déjà pris par
      # Browserless sur les VMs de test, d'où 3001. GF_SERVER_ROOT_URL doit
      # refléter ce port dans le .env pour que l'OAuth Grafana redirige juste.
      - "${GRAFANA_DEV_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      # Collecteur intégré à la stack (rôle=portail, spec 30 §3.3) — capte les logs
      # de portal/caddy/loki/grafana/postgres via le socket Docker + journald du host.
      LOKI_URL: "http://loki:3100/loki/api/v1/push"
      HOSTNAME: ${BASE_DOMAIN}
      MODULE: devpod
      ROLE: portail
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - internal

  # Termix — client SSH self-hosted (epic synchro config de connexion). Démarre
  # avec la stack ; le portail l'alimentera via un contrat OpenAPI + un automate
  # (aucune intégration en dur). Port interne 8080 (comme le portail) → publié sur
  # un port hôte distinct paramétrable pour éviter la collision.
  termix:
    image: ghcr.io/lukegus/termix:latest
    restart: unless-stopped
    # OIDC natif de Termix contre Keycloak (realm yoops). Provisioning par variables
    # d'env (pas d'env_file : n'injecte QUE le secret résolu, pas tout /data/.env).
    # Le Cloudflare Tunnel route termix.yoops.org → ce conteneur (port publié
    # ci-dessous) ; Termix construit son redirect vers termix.yoops.org/auth/callback.
    environment:
      PORT: "8080"
      # OIDC entièrement paramétrable depuis /data/.env (résolu par `docker compose
      # --env-file` au déploiement). Défauts calés sur le realm Keycloak `yoops` : la
      # SEULE variable à poser dans /data/.env est TERMIX_OIDC_CLIENT_SECRET (le reste
      # est overridable au besoin). Les endpoints dérivent de l'issuer (préfixe résolu
      # + suffixe littéral) → un seul TERMIX_OIDC_ISSUER à changer si le realm diffère.
      OIDC_CLIENT_ID: "${TERMIX_OIDC_CLIENT_ID:-termix}"
      OIDC_CLIENT_SECRET: "${TERMIX_OIDC_CLIENT_SECRET:-}"
      OIDC_ISSUER_URL: "${TERMIX_OIDC_ISSUER:-https://security.yoops.org/realms/yoops}"
      OIDC_AUTHORIZATION_URL: "${TERMIX_OIDC_ISSUER:-https://security.yoops.org/realms/yoops}/protocol/openid-connect/auth"
      OIDC_TOKEN_URL: "${TERMIX_OIDC_ISSUER:-https://security.yoops.org/realms/yoops}/protocol/openid-connect/token"
      OIDC_USERINFO_URL: "${TERMIX_OIDC_ISSUER:-https://security.yoops.org/realms/yoops}/protocol/openid-connect/userinfo"
      OIDC_SCOPES: "${TERMIX_OIDC_SCOPES:-openid email profile}"
      # CONTRAT portail (spec 18) : les comptes Termix sont matchés par username=email
      # (`find_user_ids`). Les défauts upstream (identifier=sub, name=claim `name`)
      # donnent des comptes OIDC dont le username N'EST PAS l'email → aucun host
      # poussé sur le compte que voit l'utilisateur SSO. On force le mapping email.
      OIDC_IDENTIFIER_PATH: "${TERMIX_OIDC_IDENTIFIER_PATH:-email}"
      OIDC_NAME_PATH: "${TERMIX_OIDC_NAME_PATH:-email}"
    volumes:
      - termix_data:/app/data
    ports:
      - "${TERMIX_DEV_PORT:-8087}:8080"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  vm_data:
  caddy_data:
  caddy_config:
  postgres_data:
  loki_data:
  grafana_data:
  alloy_data:
  termix_data:
